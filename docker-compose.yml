version: '3.8'

services:
  # Backend services
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    deploy:
      resources:
        limits:
          cpus: "16"
          memory: 16G
    volumes:
      - ./api:/var/www
    environment:
      PHP_INI_SCAN_DIR: ":/usr/local/etc/php/custom"
      PHP_INI_DIRECTIVES: "short_open_tag=Off"
    depends_on:
      - database
    networks:
      - backend-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - backend-network

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sticky_notes
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend-network

  # Frontend service
  frontend:
    build:
      context: ./docker
      dockerfile: Dockerfile
    ports:
      - "19999:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
    networks:
      - frontend-network

networks:
  backend-network:
  frontend-network:

volumes:
  db-data: